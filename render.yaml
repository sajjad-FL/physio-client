# Static build: sitemap/robots use VITE_PUBLIC_SITE_URL (see vite.config.js). Committed .env.production sets it;
# these envVars override for staging or if you remove .env.production from the repo.
services:
  - type: web
    name: physio-client
    env: static
    buildCommand: npm run build
    envVars:
      - key: VITE_PUBLIC_SITE_URL
        value: https://nearbyphysio.com
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html